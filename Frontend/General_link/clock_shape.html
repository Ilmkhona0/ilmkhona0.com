<!DOCTYPE html>
<html lang="en">
<head>
    <title>Circle_clock</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <style>
body {
  margin: 0;
  padding: 0;
  background: #fff;
}

.clock {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  border: 15px solid #8a5fff;
  border-radius: 50%;
  background: url(face.png);
  background-size: cover;
  box-shadow: -2px 2px 0 #e23232,
  inset 0 0 20px rgba(0, 0, 0, 0.5);
}

.clock::before {
  content: '';
  position: absolute;
  left: 50%;
  width: 40%;
  height: 6px;
  background: #262626;
  top: calc(50% - 3px);
  border-radius: 3px;
  animation: animate 4s linear infinite;
  transform-origin: left;
}

@keyframes animate {
  0% {
      transform: rotate(0deg);
  }
  100% {
      transform: rotate(360deg);
  }
}

.clock::after {
  content: '';
  position: absolute;
  left: 50%;
  width: 30%;
  top: calc(50% - 3px);
  border-radius: 3px;
  height: 6px;
  background: #262626;
  animation: anime 60s linear infinite;
  transform-origin: left;
}

@keyframes anime {
  0% {
      transform: rotate(-90deg);
  }
  100% {
      transform: rotate(270deg);
  }
}

span {
  display: block;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 10px;
  height: 10px;
  background: #ff5f5f;
  border-radius: 50%;
  z-index: 1;
}
   </style>
   </body>
</html>
